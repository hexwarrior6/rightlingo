<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="browserBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3F3F5"/>
      <stop offset="100%" stop-color="#E5E5E8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="480" fill="#F8FAFC" rx="16"/>

  <!-- Simulated Browser Window -->
  <g transform="translate(30, 24)">
    <!-- Window Outline & Shadow -->
    <rect width="800" height="432" rx="10" fill="#F6F7F9" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/>

    <!-- Browser Titlebar -->
    <path d="M 0 10 Q 0 0 10 0 L 790 0 Q 800 0 800 10 L 800 42 L 0 42 Z" fill="url(#browserBar)"/>
    <!-- Window Controls -->
    <circle cx="20" cy="21" r="5.5" fill="#EF4444"/>
    <circle cx="38" cy="21" r="5.5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5.5" fill="#10B981"/>

    <!-- Omnibox / URL Bar -->
    <rect x="90" y="9" width="620" height="24" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8"/>
    <circle cx="106" cy="21" r="4" fill="#9CA3AF"/>
    <text x="120" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4B5563">chrome-extension://rightlingo/options.html</text>

    <!-- Settings Container (Centered 520px) -->
    <g transform="translate(140, 56)">
      <!-- Header -->
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1F1F1F">RightLingo 设置</text>
      <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#6B7280">原生右键翻译 · v0.8.2 · 改动即生效</text>

      <!-- Card 1: 翻译设置 -->
      <g transform="translate(0, 54)">
        <rect width="520" height="150" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="18" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="1">翻译</text>

        <!-- Row 1: 目标语言 -->
        <g transform="translate(18, 48)">
          <text x="0" y="4" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#1F1F1F">目标语言</text>
          <text x="0" y="22" font-family="-apple-system, sans-serif" font-size="11.5" fill="#6B7280">翻译结果的目标呈现语言（支持全球 130+ 语言）</text>
          <!-- Select Box -->
          <rect x="330" y="-12" width="154" height="30" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
          <text x="342" y="8" font-family="-apple-system, sans-serif" font-size="12.5" fill="#1F1F1F">中文 (简体)</text>
          <path d="M 466 5 L 471 10 L 476 5 Z" fill="#6B7280"/>
        </g>

        <line x1="18" y1="92" x2="502" y2="92" stroke="#F1F3F4" stroke-width="1"/>

        <!-- Row 2: 词典模式 -->
        <g transform="translate(18, 120)">
          <text x="0" y="4" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#1F1F1F">词典模式</text>
          <text x="0" y="22" font-family="-apple-system, sans-serif" font-size="11.5" fill="#6B7280">选中单个单词时，二级菜单按词性分组展示丰富释义</text>
          <!-- Toggle Switch (ON) -->
          <rect x="444" y="-8" width="40" height="22" rx="11" fill="#1A73E8"/>
          <circle cx="473" cy="3" r="8" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Card 2: 菜单显示与复制 -->
      <g transform="translate(0, 218)">
        <rect width="520" height="136" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
        <text x="18" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#9CA3AF" letter-spacing="1">菜单排版 &amp; 复制</text>

        <!-- Row 1: 二级菜单行数 -->
        <g transform="translate(18, 48)">
          <text x="0" y="4" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#1F1F1F">二级菜单行数</text>
          <text x="0" y="22" font-family="-apple-system, sans-serif" font-size="11.5" fill="#6B7280">长句子或长词典在二级菜单展开的最大行数</text>
          <!-- Segmented Control: 3 / 5 / 8 / 10 -->
          <rect x="334" y="-12" width="150" height="28" rx="6" fill="#F1F3F4"/>
          <text x="350" y="7" font-family="-apple-system, sans-serif" font-size="12" fill="#6B7280">3</text>
          <!-- Active "5" -->
          <rect x="368" y="-10" width="36" height="24" rx="5" fill="#FFFFFF" filter="url(#shadow)"/>
          <text x="386" y="7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A73E8" text-anchor="middle">5</text>
          <text x="424" y="7" font-family="-apple-system, sans-serif" font-size="12" fill="#6B7280">8</text>
          <text x="460" y="7" font-family="-apple-system, sans-serif" font-size="12" fill="#6B7280">10</text>
        </g>

        <line x1="18" y1="88" x2="502" y2="88" stroke="#F1F3F4" stroke-width="1"/>

        <!-- Row 2: 复制偏好 -->
        <g transform="translate(18, 112)">
          <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#1F1F1F">点击译文时复制</text>
          <!-- Segmented Control: 仅译文 / 原文+译文 -->
          <rect x="320" y="-14" width="164" height="28" rx="6" fill="#F1F3F4"/>
          <!-- Active "仅译文" -->
          <rect x="322" y="-12" width="76" height="24" rx="5" fill="#FFFFFF" filter="url(#shadow)"/>
          <text x="360" y="5" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#1A73E8" text-anchor="middle">仅译文</text>
          <text x="442" y="5" font-family="-apple-system, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">原文 + 译文</text>
        </g>
      </g>
    </g>
  </g>
</svg>
