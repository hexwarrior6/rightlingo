<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="browserBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3F3F5"/>
      <stop offset="100%" stop-color="#E5E5E8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="860" height="480" fill="#F8FAFC" rx="16"/>

  <!-- Simulated Browser Window -->
  <g transform="translate(30, 24)">
    <!-- Window Outline & Shadow -->
    <rect width="800" height="432" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#shadow)"/>

    <!-- Browser Titlebar -->
    <path d="M 0 10 Q 0 0 10 0 L 790 0 Q 800 0 800 10 L 800 42 L 0 42 Z" fill="url(#browserBar)"/>
    <!-- Window Controls -->
    <circle cx="20" cy="21" r="5.5" fill="#EF4444"/>
    <circle cx="38" cy="21" r="5.5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5.5" fill="#10B981"/>

    <!-- Omnibox / URL Bar -->
    <rect x="90" y="9" width="620" height="24" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.8"/>
    <circle cx="106" cy="21" r="4" fill="#9CA3AF"/>
    <text x="120" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4B5563">https://techblog.example.com/modern-web-architecture</text>

    <!-- Web Page Article Body -->
    <g transform="translate(48, 72)">
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Simplicity in Modern Web Design</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Published in Software Engineering · 5 min read</text>
      <line x1="0" y1="56" x2="704" y2="56" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Article with selected sentence -->
      <g transform="translate(0, 92)">
        <rect x="0" y="-16" width="680" height="48" fill="#B4D5FE" rx="3"/>
        <text x="4" y="0" font-family="Georgia, serif" font-size="14.5" fill="#0F172A">
          "The greatest challenge of modern UI design is not adding more features, but removing
        </text>
        <text x="4" y="24" font-family="Georgia, serif" font-size="14.5" fill="#0F172A">
          the unnecessary distractions so that users can stay entirely focused on their primary tasks."
        </text>
      </g>
    </g>

    <!-- Context Menu (Level 1: Summary with Submenu Arrow) -->
    <g transform="translate(240, 185)" filter="url(#shadow)">
      <rect width="250" height="188" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Top Item: Summary with RightLingo Blue Hover -->
      <rect x="4" y="5" width="242" height="28" rx="5" fill="#EFF6FF"/>
      <rect x="12" y="11" width="16" height="16" rx="4" fill="#2563EB"/>
      <text x="20" y="23" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">译</text>
      <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#1D4ED8">译文：现代 UI 设计的最大挑战不是…</text>
      <path d="M 234 15 L 239 19 L 234 23 Z" fill="#2563EB"/>

      <!-- Standard browser menu items -->
      <line x1="12" y1="38" x2="238" y2="38" stroke="#F1F5F9" stroke-width="1"/>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#1E293B">复制 (Copy)</text>
      <text x="215" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8">⌘C</text>
      <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#1E293B">在 Google 中搜索选中文本</text>
      <text x="16" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#1E293B">打印...</text>
      <line x1="12" y1="128" x2="238" y2="128" stroke="#F1F5F9" stroke-width="1"/>
      <text x="16" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#1E293B">朗读选中文本</text>
      <text x="16" y="174" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#1E293B">检查 (Inspect)</text>
    </g>

    <!-- Context Submenu (Level 2: Folded Multi-line Sentence) -->
    <g transform="translate(494, 185)" filter="url(#shadow)">
      <rect width="280" height="175" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Submenu Line 1 -->
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#1E293B">现代 UI 设计的最大挑战并不是增加更</text>
      <!-- Submenu Line 2 -->
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#1E293B">多功能，而是消除不必要的干扰，让</text>
      <!-- Submenu Line 3 -->
      <text x="14" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#1E293B">用户能完全专注于他们的核心任务。</text>

      <!-- Submenu Divider -->
      <line x1="12" y1="90" x2="268" y2="90" stroke="#F1F5F9" stroke-width="1"/>

      <!-- Action item 1: Web translate -->
      <g transform="translate(14, 114)">
        <path d="M 0 -2 L 10 -2 M 7 -5 L 10 -2 L 7 1" stroke="#64748B" stroke-width="1.4" fill="none"/>
        <text x="16" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#475569">在 Google 翻译中翻译</text>
        <path d="M 248 -8 L 256 -8 L 256 0 M 256 -8 L 250 -2" stroke="#94A3B8" stroke-width="1.2" fill="none"/>
      </g>

      <!-- Action item 2: One-click Copy -->
      <g transform="translate(14, 146)">
        <rect x="0" y="-10" width="10" height="12" rx="1.5" stroke="#2563EB" stroke-width="1.2" fill="none"/>
        <path d="M 3 -12 L 11 -12 Q 13 -12 13 -10 L 13 0" stroke="#2563EB" stroke-width="1.2" fill="none"/>
        <text x="18" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600" fill="#2563EB">复制完整译文</text>
        <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#3B82F6">点击复制</text>
      </g>
    </g>
  </g>
</svg>
